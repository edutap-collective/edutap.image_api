[project]
name = "edutap.image_api"
version = "1.0.0.dev0"
description = "A eduTAP Image API Service based on FastAPI to to auto crop and transform photos for id cards and passes in smart device wallets."
keywords = ["image", "API"]
readme = "README.md"
authors = [
    {name = "Philipp Auersperg-Castell", email = "phil@bluedynamics.com"},
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Object Brokering",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic[email,dotenv]>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "fastapi",
    "fastapi-chameleon",
    "python-multipart",
    "uvicorn",
    "requests",
    "aiokafka",
    "pillow",
    "numpy",
    "anyio",
    "mediapipe>=0.10.14",
  ]

[project.urls]
Source = "https://github.com/edutap-eu/edutap.image_api"
Issues = "https://github.com/edutap-eu/edutap.image_api/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_image_api/index.html"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "requests-mock",
]
typecheck  = [
    "mypy",
    "types-requests",
    "pytest-stub",
]
develop = [
    "pdbpp",
    "ipython",
]

[project.scripts]
image_api = "edutap.image_api.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edutap.image_api" = ["assets/*.task"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
markers = [
    "integration: tests that load the MediaPipe model and real images",
]
asyncio_mode = "auto"

[tool.isort]
profile = "plone"

[tool.black]
target-version = ["py310"]
include = "src"

[tool.codespell]
ignore-words-list = "discreet,"
skip = "./ansible/*.yml,traefik.yaml,./.vscode/*.json"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "tox.ini",
    "mypy.ini",
    ".flake8",
    "mx.ini",
    "ansible/*.yml",
    "Vagrantfile",
]
