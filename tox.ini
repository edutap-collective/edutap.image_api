# Generated from:
# https://github.com/plone/meta/tree/master/config/default
# See the inline comments on how to expand/tweak this configuration file
[tox]
# We need 4.4.0 for constrain_package_deps.
min_version = 4.4.0
# The floor is 3.13, set by edutap.observability_settings -- see the comment on
# `requires-python` in pyproject.toml for what that cost and why it cost little.
#
# The note that used to stand here, "mediapipe ships wheels only up to Python 3.12",
# was true of the 0.10.x series and is no longer true of what this package resolves:
# mediapipe 1.0.1 ships one pure `py3` wheel.
envlist =
    py313
    py314
    test
    mypy
    lint

[gh-actions]
python =
    3.13: py313, mypy
    3.14: py314, lint

[testenv]
use_develop = true
skip_install = false
constrain_package_deps = true

commands =
    pytest {posargs}
extras =
    test

[testenv:format]
description = automatically reformats code
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run -a pyupgrade
    pre-commit run -a isort
    pre-commit run -a black

[testenv:lint]
description = run linters that will help improve the code style
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run -a

[testenv:mypy]
description = run type chekcer mypy
skip_install = false
deps =
    mypy
commands =
    mypy --explicit-package-bases .
extras =
    typecheck

