ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
- repo: https://github.com/asottile/pyupgrade
  rev: v3.11.2
  hooks:
  - id: pyupgrade
- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
  - id: isort
- repo: https://github.com/psf/black
  rev: 23.9.1
  hooks:
  - id: black
- repo: https://github.com/PyCQA/flake8
  rev: 6.1.0
  hooks:
  - id: flake8
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.5.1
  hooks:
  - id: mypy
    additional_dependencies:
    - "types-requests"
    - "pytest-stub"
- repo: https://github.com/codespell-project/codespell
  rev: v2.2.5
  hooks:
  - id: codespell
    additional_dependencies:
    - tomli
- repo: https://github.com/mgedmin/check-manifest
  rev: "0.49"
  hooks:
  - id: check-manifest
#    args: [--create]
- repo: https://github.com/regebro/pyroma
  rev: "4.2"
  hooks:
  - id: pyroma
- repo: https://github.com/mgedmin/check-python-versions
  # 0.21.3 predates Python 3.13 and therefore cannot read this package's own
  # `requires-python` any more: with `>=3.13` it resolves the range to the empty set
  # and reports a mismatch against the classifiers no matter what they say. It was
  # already failing before the floor moved -- it read `>=3.10` as "3.10, 3.11" -- so
  # this bump repairs a check rather than silencing one.
  rev: "0.24.0"
  hooks:
  - id: check-python-versions
    args: ['--only', 'pyproject.toml']
